services:
  - type: web
    name: jszz-english-trainer
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false        # 在 Render 控制台手动填入 Neon 的 Direct connection URI
